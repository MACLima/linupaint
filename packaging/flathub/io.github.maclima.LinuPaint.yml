# Manifest submitted to github.com/flathub/flathub. Update tag and commit for each release.
app-id: io.github.maclima.LinuPaint
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: linupaint
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=cups
modules:
  - name: linupaint
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DLINUPAINT_BUILD_TESTS=OFF
    sources:
      - type: git
        url: https://github.com/MACLima/linupaint.git
        tag: v1.0.0
        commit: 25e6b0982cdc7df0e366732d79811ef59f7d7c2d
